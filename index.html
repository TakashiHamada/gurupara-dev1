<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip-Flap Crank Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Start Overlay -->
    <div class="start-overlay" id="start-overlay">
        <button class="start-btn" id="start-btn" type="button" disabled>Loading...</button>
    </div>

    <div class="playdate-wrapper">
        <div class="playdate-device">
            <!-- Corner screws (左上はなし) -->
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>

            <!-- Screen with black bezel -->
            <div class="screen-bezel">
                <canvas id="game-canvas" width="400" height="240" tabindex="0"></canvas>
            </div>

            <!-- Speaker grille -->
            <div class="speaker"></div>

            <!-- Menu button (画面右横) -->
            <div class="menu-btn" role="button" tabindex="-1" aria-label="Menu button (decorative)"></div>

            <!-- Lock button (右上) -->
            <div class="lock-btn"></div>

            <!-- D-pad -->
            <div class="dpad" role="button" tabindex="-1" aria-label="D-pad (decorative)">
                <div class="dpad-h"></div>
                <div class="dpad-v"></div>
            </div>

            <!-- A / B Buttons -->
            <div class="pd-btn btn-b" role="button" tabindex="-1" aria-label="B button (decorative)"><span>B</span></div>
            <div class="pd-btn btn-a" role="button" tabindex="-1" aria-label="A button (decorative)"><span>A</span></div>

            <!-- Crank -->
            <div class="crank-base"></div>
            <div class="crank-rotator">
                <div class="crank-flipper">
                    <div class="crank-handle"></div>
                    <div class="crank-arm"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Audio Controls (bottom-left corner) -->
    <div class="audio-controls" id="audio-controls">
        <button class="audio-mute-btn" id="audio-mute-btn" type="button" aria-label="Mute/Unmute">
            <svg class="audio-icon audio-icon-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            <svg class="audio-icon audio-icon-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
        </button>
        <input type="range" class="audio-slider" id="audio-slider"
               min="0" max="100" value="100" aria-label="Volume">
    </div>

    <!-- Keyboard reminder -->
    <div class="keyboard-reminder" id="keyboard-reminder" lang="en">
        Please use your keyboard to play the game.
    </div>

    <!-- Controls Help -->
    <div class="controls-info">
        <kbd>←</kbd><kbd>→</kbd> Flip pages &nbsp;
        <kbd>Space</kbd> Grab / Release &nbsp;
        <kbd>Enter</kbd> Check / Select &nbsp;
        <kbd>Esc</kbd> Pause / Back
    </div>

    <script>
        // Flash keyboard reminder when decorative buttons are clicked
        document.querySelectorAll('.dpad, .pd-btn, .menu-btn').forEach(el => {
            el.addEventListener('click', () => {
                const reminder = document.getElementById('keyboard-reminder');
                reminder.classList.remove('flash');
                void reminder.offsetWidth;
                reminder.classList.add('flash');
            });
        });

        // Crank spin animation on left/right key press
        let crankFlipped = false;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                crankFlipped = !crankFlipped;
                document.querySelector('.crank-flipper')
                    .style.setProperty('--crank-flip', crankFlipped ? '-1' : '1');
            }
        });
    </script>

    <script type="module" src="main.js?v=3"></script>
</body>
</html>
