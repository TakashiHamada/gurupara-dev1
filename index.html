<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruPara! - Web Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="console">
        <!-- Playdate Body -->
        <div class="console-body">
            <!-- Screen -->
            <div class="screen-bezel">
                <canvas id="game-canvas" width="400" height="240" tabindex="0"></canvas>
            </div>

            <!-- D-Pad -->
            <div class="dpad">
                <div class="dpad-arm up"></div>
                <div class="dpad-arm down"></div>
                <div class="dpad-arm left"></div>
                <div class="dpad-arm right"></div>
                <div class="dpad-center"></div>
            </div>

            <!-- A/B Buttons -->
            <div class="buttons">
                <div class="btn btn-a">A</div>
                <div class="btn btn-b">B</div>
            </div>
        </div>

        <!-- Crank -->
        <div class="crank-area">
            <div class="crank-base">
                <div id="crank-handle">
                    <div class="crank-shaft"></div>
                    <div class="crank-knob"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls Help -->
    <div class="controls-info">
        <kbd>←</kbd><kbd>→</kbd> Crank &nbsp;
        <kbd>Space</kbd> Grab &nbsp;
        <kbd>Enter</kbd> Check / Select &nbsp;
        <kbd>Esc</kbd> Pause / Back
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
